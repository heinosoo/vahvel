name: release

# Bumps the version, checks the repository and the Hex tarball, then tags and
# creates a GitHub release. Publishing to Hex is publish.yml; it runs here only
# when `publish` is set. consumer.yml is started on the tag and not awaited.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to increment"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      publish:
        description: "Publish to Hex once the release exists"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  # Dispatching consumer.yml and publish.yml on the new tag.
  actions: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Cargo.lock follows when `just test` builds; version_test checks all four.
      - name: Bump version
        run: |
          CURRENT=$(sed -n 's/^version = "\(.*\)"/\1/p' gleam.toml)
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) TARGET="$((MAJOR + 1)).0.0" ;;
            minor) TARGET="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) TARGET="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac
          if git rev-parse -q --verify "refs/tags/v${TARGET}" >/dev/null; then
            echo "::error::Tag v${TARGET} already exists"
            exit 1
          fi
          sed -i "s/^version = \".*\"/version = \"${TARGET}\"/" gleam.toml
          sed -i "0,/^version = /s/^version = \".*\"/version = \"${TARGET}\"/" priv/native/Cargo.toml
          sed -i "s/^pub const package_version = \".*\"/pub const package_version = \"${TARGET}\"/" src/vahvel/internal/version.gleam
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      - uses: cachix/install-nix-action@v31
      # Exports the flake's dev shell into later steps' environment.
      - uses: nicknovitski/nix-develop@v1
      - run: just lint
      - run: just test

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "release: v${TARGET}"

      # Gleam packs priv/ regardless of .gitignore, so the tarball comes from a
      # fresh clone: the library `just test` built must not ship.
      - name: Build the Hex tarball
        run: |
          git clone -q . "$RUNNER_TEMP/clean"
          (cd "$RUNNER_TEMP/clean" && gleam export hex-tarball)

      - name: Install the tarball into a fresh project
        run: |
          cd "$RUNNER_TEMP"
          mkdir vahvel consumer consumer/src
          tar -xOf "clean/build/vahvel-${TARGET}.tar" contents.tar.gz | tar -xz -C vahvel
          if find vahvel -name '*.so' -o -name '*.dll' -o -name '*.dylib' | grep .; then
            echo "::error::compiled library in the Hex package"
            exit 1
          fi
          printf '%s\n' 'name = "consumer"' 'version = "1.0.0"' '[dependencies]' \
            'vahvel = { path = "../vahvel" }' > consumer/gleam.toml
          cd consumer
          gleam run -m vahvel/setup

      # Atomic, and not forced: fails if main moved during the run.
      - name: Push commit and tag
        run: |
          git tag "v${TARGET}"
          git push --atomic origin HEAD:main "refs/tags/v${TARGET}"

      - name: Create GitHub release and start follow-up workflows
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            Built from source on first use: requires the Erlang target and
            [Rust](https://rustup.rs) with `cargo` and a platform linker. See the
            README for installation and limitations.
        run: |
          gh release create "v${TARGET}" --title "v${TARGET}" --notes "$NOTES" --generate-notes
          gh workflow run consumer.yml --ref "v${TARGET}"
          if [ "${{ inputs.publish }}" = true ]; then
            gh workflow run publish.yml --ref "v${TARGET}"
          fi
