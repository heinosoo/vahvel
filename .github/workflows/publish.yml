name: publish

# Publishes a release tag to Hex (package and docs) from a clean checkout, then
# installs it from Hex into a fresh project. Run on a tag, or let release.yml
# dispatch it. If only the smoke test fails, retry with "Re-run failed jobs".

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: nicknovitski/nix-develop@v1
      - name: Check the tag
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' gleam.toml)
          if [ "$GITHUB_REF" != "refs/tags/v${VERSION}" ]; then
            echo "::error::run on tag v${VERSION}, not ${GITHUB_REF}"
            exit 1
          fi
      # Below 1.0.0, gleam publish asks for this phrase even with --yes, and a
      # missing answer exits 0 without publishing; the next step catches that.
      - name: Publish
        run: echo "I am not using semantic versioning" | gleam publish --yes
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}
      # Hex stages releases published with a key until an owner approves them
      # with 2FA. A release that never appears times out here instead.
      - name: Wait for approval on Hex
        timeout-minutes: 60
        run: |
          echo "Approve vahvel ${GITHUB_REF_NAME#v} at https://hex.pm/dashboard/staged-releases" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          until curl -sf "https://hex.pm/api/packages/vahvel/releases/${GITHUB_REF_NAME#v}" > /dev/null; do
            sleep 30
          done

  smoke:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: nicknovitski/nix-develop@v1
      - name: Install from Hex into a fresh project
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd "$RUNNER_TEMP"
          mkdir -p consumer/src
          printf '%s\n' 'name = "consumer"' 'version = "1.0.0"' '[dependencies]' \
            "vahvel = \"== ${VERSION}\"" > consumer/gleam.toml
          cd consumer
          # The package can take a moment to reach the repository mirror.
          for attempt in 1 2 3 4 5 6; do
            gleam deps download && break
            [ "$attempt" = 6 ] && exit 1
            sleep 30
          done
          gleam run -m vahvel/setup
          echo "vahvel ${VERSION}: installed from Hex and built on ubuntu-latest." >> "$GITHUB_STEP_SUMMARY"
