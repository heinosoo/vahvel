name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.14.0"
          rebar3-version: "3"
          # elixir-version: "1"
      - uses: dtolnay/rust-toolchain@stable
      # Minimal build step for Linux x86_64 to make tests pass.
      # This will be expanded in Step 4 to build for multiple platforms
      # and upload release artifacts.
      - name: Build Rust NIF
        run: |
          cd native/waffle
          cargo build --release
          mkdir -p ../../priv
          cp target/release/libwaffle.so ../../priv/waffle.so
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
