name: test

permissions: read-all

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # Exports the flake's dev shell into later steps' environment.
      - uses: nicknovitski/nix-develop@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: priv/native -> ../../target
      - uses: actions/cache@v4
        with:
          path: build/packages
          key: gleam-deps-${{ hashFiles('gleam.toml', 'manifest.toml') }}
          restore-keys: gleam-deps-
      - run: just lint
      - run: just test
