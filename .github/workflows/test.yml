name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.14.0"
          rebar3-version: "3"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/waffle
      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: native/waffle
      - name: Run Clippy
        run: cargo clippy -- -D warnings
        working-directory: native/waffle
      - run: gleam deps download
      - name: Build NIF
        run: gleam run -m waffle_build
      - run: gleam test
      - run: gleam format --check src test
