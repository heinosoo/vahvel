name = "vahvel"
version = "0.4.0"
description = "Linear and mixed-integer programming for Gleam, solved natively in Rust"
licences = ["Apache-2.0"]
repository = { type = "github", user = "heinosoo", repo = "vahvel" }
internal_modules = [
  "vahvel/internal",
  "vahvel/internal/*",
]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
shellout = ">= 1.8.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
tom = ">= 2.1.0 and < 3.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
