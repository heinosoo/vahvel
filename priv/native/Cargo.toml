[package]
name = "vahvel"
version = "0.5.0"
edition = "2024"
# rustler 0.39 requires 1.91.
rust-version = "1.91"
description = "Native solver for the vahvel Gleam package"
license = "Apache-2.0"
repository = "https://github.com/heinosoo/vahvel"
publish = false

[lib]
name = "vahvel"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.39"
microlp = { version = "0.8", default-features = false }
